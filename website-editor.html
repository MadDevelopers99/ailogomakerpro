<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8548717208623024" crossorigin="anonymous"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website Editor — Logo Maker</title>
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600;700;800&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .website-editor-shell { display:flex; height:100vh; overflow:hidden; }
  .website-editor-panel { width:320px; flex-shrink:0; background:#fff; border-right:1px solid var(--border); overflow-y:auto; padding:20px; }
  .website-editor-main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .website-preview-scroll { flex:1; overflow-y:auto; background:#e9eaef; }
  .site-picker-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; max-height:220px; overflow-y:auto; }
  .site-picker-grid button { aspect-ratio:16/9; padding:0; border:1px solid var(--border); border-radius:6px; overflow:hidden; cursor:pointer; background:#fff; }
  .site-picker-grid img { width:100%; height:100%; object-fit:cover; }
  .theme-color-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .theme-color-item { text-align:center; font-size:11px; color:var(--text-faint); }
  .theme-color-item input { width:44px; height:36px; padding:2px; border:1px solid var(--border); border-radius:8px; background:var(--bg); display:block; margin-bottom:3px; }
  .section-jump-btn { display:block; width:100%; text-align:left; padding:8px 10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); font-size:12.5px; margin-bottom:6px; cursor:pointer; }
  .section-jump-btn:hover { border-color:var(--primary); color:var(--primary); }
</style>
</head>
<body>
  <div class="website-editor-shell">
    <div class="website-editor-panel" id="rightPanel"></div>
    <div class="website-editor-main">
      <div class="editor-topbar">
        <div class="left">
          <a class="back" href="website-builder.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Back</a>
          <button class="icon-btn" id="undoBtn" title="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-1"/></svg></button>
          <button class="icon-btn" id="redoBtn" title="Redo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h1"/></svg></button>
        </div>
        <div id="editorTitle" style="font-weight:700;font-size:14px;">Website</div>
        <div class="right">
          <button class="btn btn-outline btn-sm" id="saveBtn">Save</button>
          <button class="btn btn-primary btn-sm" id="downloadBtn">⬇ Download HTML</button>
        </div>
      </div>
      <div class="website-preview-scroll" id="previewScroll">
        <div id="sitePreview"></div>
      </div>
    </div>
  </div>

  <script type="module" src="js/website-editor.js"></script>
</body>
</html>
