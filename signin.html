<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Logo Maker</title>
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .signin-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .signin-card { width: 100%; max-width: 380px; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); text-align: center; }
  .signin-card .brand { justify-content: center; margin-bottom: 22px; }
  .signin-card h2 { margin: 0 0 6px; font-size: 20px; }
  .signin-card p { margin: 0 0 22px; color: var(--text-dim); font-size: 13.5px; line-height: 1.6; }
  .signin-note { margin-top: 16px; font-size: 12px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="signin-wrap">
    <div class="signin-card">
      <a class="brand" href="index.html"><span class="brand-mark">M</span> LOGO MAKER</a>
      <h2>No account needed</h2>
      <p>This is a free demo tool — there's no sign-in, no password, and nothing is sent to a server. Your saved logos, uploads and brand kit live locally in this browser.</p>
      <a class="btn btn-primary" href="dashboard.html" style="width:100%;">Continue to Dashboard</a>
    </div>
  </div>
</body>
</html>
