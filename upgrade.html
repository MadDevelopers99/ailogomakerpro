<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pricing — Logo Maker</title>
<meta name="description" content="Logo Maker is free to use — browse templates, customize your logo and download PNG/JPG at no cost. See what's included.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="/upgrade.html">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .plans { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 640px; }
  .plan-card { background: #fff; border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; }
  .plan-card.pro { border-color: var(--primary); box-shadow: var(--shadow); }
  .plan-card h3 { margin: 0 0 4px; }
  .plan-price { font-size: 30px; font-weight: 800; margin: 10px 0 18px; }
  .plan-price span { font-size: 13px; font-weight: 500; color: var(--text-dim); }
  .plan-card ul { list-style: none; padding: 0; margin: 0 0 20px; font-size: 13.5px; color: var(--text-dim); display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body data-page="upgrade">
  <div class="app-layout">
    <div id="appSidebar"></div>
    <main class="app-main">
      <div class="app-topbar"><div><h1>Upgrade</h1><p>This is a demo project — no real payments are processed</p></div></div>
      <div class="plans">
        <div class="plan-card">
          <h3>Free</h3>
          <div class="plan-price">$0<span>/mo</span></div>
          <ul><li>✓ Browse all templates</li><li>✓ Full editor access</li><li>✓ PNG/JPG downloads</li><li>✓ Local Brand Kit</li></ul>
          <button class="btn btn-outline" style="width:100%;" disabled>Current Plan</button>
        </div>
        <div class="plan-card pro">
          <h3>Pro</h3>
          <div class="plan-price">$12<span>/mo</span></div>
          <ul><li>✓ Everything in Free</li><li>✓ SVG &amp; PDF export</li><li>✓ Print-ready files</li><li>✓ Priority support</li></ul>
          <button class="btn btn-primary" style="width:100%;" disabled>Coming Soon</button>
        </div>
      </div>
    </main>
  </div>
  <script src="js/app-shell.js" type="module"></script>
</body>
</html>
