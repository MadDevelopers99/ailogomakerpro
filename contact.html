<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us — Logo Maker</title>
<meta name="description" content="Get in touch with the Logo Maker team.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="/contact.html">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="navbar">
    <div class="bar">
      <a class="brand" href="index.html"><span class="brand-mark">M</span> LOGO MAKER</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="templates.html">Templates</a>
        <a href="my-logos.html">My Logos</a>
        <a href="upgrade.html">Pricing</a>
        <a href="blog.html">Blog</a>
        <a href="developer.html" target="_blank" rel="noopener">Developer</a>
      </nav>
      <a class="btn btn-primary btn-sm" href="signin.html">Sign In</a>
    </div>
  </header>

  <section class="content-section">
    <div class="container" style="max-width:520px;">
      <h2 style="text-align:left;">Contact Us</h2>
      <p style="color:var(--text-dim);font-size:14px;line-height:1.6;margin-bottom:24px;">Questions, feedback or bug reports — send us a message below.</p>
      <form id="contactForm" style="background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;">
        <div class="field"><label>Name</label><input type="text" id="cName" required></div>
        <div class="field"><label>Email</label><input type="text" id="cEmail" required></div>
        <div class="field"><label>Message</label><textarea id="cMessage" required style="width:100%;min-height:110px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-family:inherit;font-size:13.5px;resize:vertical;"></textarea></div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
        <p id="contactNote" style="font-size:12px;color:var(--text-faint);margin-top:14px;text-align:center;">This is a demo form — messages aren't sent anywhere, they just confirm here.</p>
      </form>
    </div>
  </section>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top:none;padding-top:0;">
        <div>© <span id="yearNow"></span> Logo Maker.</div>
        <div><a href="index.html" style="color:#9296ac;">Back to Home</a></div>
      </div>
    </div>
  </footer>
  <script>
    document.getElementById("yearNow").textContent = new Date().getFullYear();
    document.getElementById("contactForm").addEventListener("submit", (e) => {
      e.preventDefault();
      document.getElementById("contactNote").textContent = "Thanks — your message was received (demo only, not actually sent).";
      document.getElementById("contactNote").style.color = "#16a34a";
      e.target.reset();
    });
  </script>
</body>
</html>
