<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8548717208623024" crossorigin="anonymous"></script>
<script src="https://quge5.com/88/tag.min.js" data-zone="276705" async data-cfasync="false"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Print & Marketing Templates — Logo Maker</title>
<meta name="description" content="Browse free, ready-made templates — Email Signatures, Letterheads, Posters, Flyers, Invoices, Menus, Postcards, Gift Certificates, Invitations, Thank You Cards and T-Shirts.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="/print-shop.html">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="print-shop">
  <div class="app-layout">
    <div id="appSidebar"></div>
    <main class="app-main">
      <div class="app-topbar">
        <div>
          <h1>Print & Marketing Templates</h1>
          <p id="subheading">Ready-made designs — pick a category to preview.</p>
        </div>
      </div>

      <div class="chip-scroll-row">
        <div class="chip-row" id="chipRow"></div>
      </div>

      <div class="card-grid" id="cardGrid"></div>

      <div class="ai-banner">
        <div class="ai-banner-icon">✨</div>
        <div style="flex:1;">
          <h3>More designs coming soon</h3>
          <p>Click any design above to open it in the editor — change the text, colors, fonts, backgrounds and logo, then download. More styles are being added regularly.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/app-shell.js" type="module"></script>
  <script type="module">
    import { renderCardToCanvas } from "./js/render-card.js";

    const meta = await fetch("data/print-templates-meta.json").then((r) => r.json());
    const fileCache = new Map();
    const PAGE_SIZE = 30;

    function qs(name) { return new URLSearchParams(window.location.search).get(name); }
    let activeCat = qs("cat") || "all";
    let visibleCount = PAGE_SIZE;
    const chipRow = document.getElementById("chipRow");
    const cardGrid = document.getElementById("cardGrid");
    const subheading = document.getElementById("subheading");

    function loadCategory(slug) {
      if (!fileCache.has(slug)) {
        fileCache.set(slug, fetch(`data/print-templates/${slug}.json`).then((r) => r.json()).then((d) => d.templates));
      }
      return fileCache.get(slug);
    }

    function renderChips() {
      chipRow.innerHTML = [`<button class="chip${activeCat === "all" ? " active" : ""}" data-cat="all">All</button>`]
        .concat(meta.categories.map((c) => `<button class="chip${c.slug === activeCat ? " active" : ""}" data-cat="${c.slug}">${c.label} (${c.count})</button>`))
        .join("");
    }

    function cardHtml(t, slug, aspect) {
      return `
        <a class="bc-card" data-id="${t.id}" href="print-editor.html?id=${t.id}&cat=${slug}" style="display:block;color:inherit;">
          ${t.premium ? `<span class="bc-premium-badge">💎 Premium</span>` : ""}
          <canvas style="aspect-ratio:${aspect};"></canvas>
          <div class="bc-meta">
            <div class="bc-name">${t.name}</div>
            <div class="bc-cat">${t.category}</div>
          </div>
        </a>`;
    }

    async function paintCards(entries) {
      const cards = [...cardGrid.querySelectorAll(".bc-card")];
      await Promise.all(cards.map((card) => {
        const entry = entries.find((e) => e.t.id === card.dataset.id);
        if (!entry) return null;
        const c = card.querySelector("canvas");
        c.width = entry.t.canvas.width;
        c.height = entry.t.canvas.height;
        return renderCardToCanvas(c, entry.t);
      }));
    }

    async function renderGrid() {
      if (activeCat === "all") {
        subheading.textContent = `A preview from all ${meta.totalTemplates.toLocaleString()} designs — pick a category above to see the full set.`;
        const entries = meta.preview.map((t) => ({ t, slug: t.__slug }));
        cardGrid.innerHTML = entries.map((e) => cardHtml(e.t, e.slug, `${e.t.canvas.width}/${e.t.canvas.height}`)).join("");
        await paintCards(entries);
        return;
      }

      const cat = meta.categories.find((c) => c.slug === activeCat);
      subheading.textContent = cat ? `${cat.count} ready-made ${cat.label.toLowerCase()} designs — pick a style to preview.` : "";
      const list = await loadCategory(activeCat);
      const shown = list.slice(0, visibleCount);
      const entries = shown.map((t) => ({ t, slug: activeCat }));
      cardGrid.innerHTML = entries.map((e) => cardHtml(e.t, e.slug, `${cat.width}/${cat.height}`)).join("");
      if (visibleCount < list.length) {
        cardGrid.innerHTML += `<button id="loadMoreBtn" class="btn btn-outline" style="grid-column:1/-1;justify-self:center;margin-top:12px;">Load more (${list.length - visibleCount} remaining)</button>`;
      }
      await paintCards(entries);
      document.getElementById("loadMoreBtn")?.addEventListener("click", () => {
        visibleCount += PAGE_SIZE;
        renderGrid();
      });
    }

    renderChips();
    renderGrid();

    chipRow.addEventListener("click", (e) => {
      const btn = e.target.closest(".chip");
      if (!btn) return;
      activeCat = btn.dataset.cat;
      visibleCount = PAGE_SIZE;
      renderChips();
      renderGrid();
    });
  </script>
</body>
</html>
