<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8548717208623024" crossorigin="anonymous"></script>
<script src="https://quge5.com/88/tag.min.js" data-zone="276705" async data-cfasync="false"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brand Kit — Logo Maker</title>
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600;700;800&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="brand-kit">
  <div class="app-layout">
    <div id="appSidebar"></div>
    <main class="app-main">
      <div class="app-topbar">
        <div><h1>Brand Kit</h1><p>Default colors and font used whenever you start a new logo</p></div>
      </div>
      <div style="max-width:420px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;">
        <div class="field"><label>Primary Color</label><input type="color" id="primaryColor"></div>
        <div class="field"><label>Secondary Color</label><input type="color" id="secondaryColor"></div>
        <div class="field"><label>Default Font</label>
          <select id="fontSelect">
            <option value="Poppins">Poppins</option>
            <option value="Inter">Inter</option>
            <option value="Montserrat">Montserrat</option>
            <option value="Playfair Display">Playfair Display</option>
            <option value="Roboto Slab">Roboto Slab</option>
          </select>
        </div>
        <button class="btn btn-primary" id="saveBtn" style="width:100%;">Save Brand Kit</button>
        <p style="font-size:12px;color:var(--text-faint);margin-top:14px;">Applies to new logos you start from Templates. Saved locally in this browser.</p>
      </div>
    </main>
  </div>
  <script src="js/app-shell.js" type="module"></script>
  <script type="module">
    import { getBrandKit, setBrandKit } from "./js/project-store.js";
    const kit = getBrandKit() || { primaryColor: "#16181d", secondaryColor: "#6b7280", font: "Poppins" };
    document.getElementById("primaryColor").value = kit.primaryColor;
    document.getElementById("secondaryColor").value = kit.secondaryColor;
    document.getElementById("fontSelect").value = kit.font;

    document.getElementById("saveBtn").addEventListener("click", () => {
      setBrandKit({
        primaryColor: document.getElementById("primaryColor").value,
        secondaryColor: document.getElementById("secondaryColor").value,
        font: document.getElementById("fontSelect").value,
      });
      const btn = document.getElementById("saveBtn");
      const old = btn.textContent;
      btn.textContent = "Saved ✓";
      setTimeout(() => (btn.textContent = old), 1400);
    });
  </script>
</body>
</html>
