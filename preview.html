<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview — Logo Maker</title>
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;600;700;800&family=Montserrat:wght@400;600;700&family=Playfair+Display:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="preview-shell">
    <div class="preview-topbar">
      <a class="back" href="editor.html" style="display:flex;align-items:center;gap:6px;color:var(--text-dim);font-weight:600;font-size:13.5px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Back
      </a>
      <div class="preview-tabs" id="previewTabs">
        <button data-view="logo" class="active">Logo</button>
        <button data-view="card">Business Card</button>
        <button data-view="mug">Mockup</button>
        <button data-view="tshirt">Social Media</button>
      </div>
      <button class="btn btn-primary btn-sm" onclick="window.location.href='download.html'">⬇ Download</button>
    </div>
    <div class="preview-body">
      <div class="preview-thumbs" id="previewThumbs"></div>
      <div class="preview-main" id="previewMain"></div>
    </div>
  </div>

  <script type="module">
    import { getCurrentProject, startProject } from "./js/project-store.js";
    import { renderProjectToCanvas } from "./js/render-logo.js";

    const project = getCurrentProject() || startProject(null);
    const offscreen = document.createElement("canvas");
    await renderProjectToCanvas(offscreen, project);
    const logoDataUrl = offscreen.toDataURL("image/png");

    const VIEWS = {
      logo: () => `<div class="mockup"><img src="${logoDataUrl}" style="max-width:340px;max-height:340px;"></div>`,
      card: () => `<div class="mockup"><div class="mockup-card"><img src="${logoDataUrl}"></div></div>`,
      mug: () => `<div class="mockup"><div class="mockup-mug"><img src="${logoDataUrl}"></div></div>`,
      tshirt: () => `<div class="mockup"><div class="mockup-tshirt"><div class="shirt-body"></div><img src="${logoDataUrl}"></div></div>`,
    };

    const thumbs = document.getElementById("previewThumbs");
    thumbs.innerHTML = Object.keys(VIEWS).map((v, i) => `
      <div class="th${i === 0 ? " active" : ""}" data-view="${v}"><img src="${logoDataUrl}"></div>
    `).join("");

    function setView(view) {
      document.getElementById("previewMain").innerHTML = VIEWS[view]();
      document.querySelectorAll(".preview-tabs button").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
      document.querySelectorAll(".th").forEach((t) => t.classList.toggle("active", t.dataset.view === view));
    }
    setView("logo");

    document.getElementById("previewTabs").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-view]");
      if (btn) setView(btn.dataset.view);
    });
    thumbs.addEventListener("click", (e) => {
      const th = e.target.closest(".th");
      if (th) setView(th.dataset.view);
    });
  </script>
</body>
</html>
