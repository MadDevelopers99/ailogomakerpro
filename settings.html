<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8548717208623024" crossorigin="anonymous"></script>
<script src="https://quge5.com/88/tag.min.js" data-zone="276705" async data-cfasync="false"></script>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Logo Maker</title>
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="settings">
  <div class="app-layout">
    <div id="appSidebar"></div>
    <main class="app-main">
      <div class="app-topbar"><div><h1>Settings</h1><p>Local preferences for this browser</p></div></div>
      <div style="max-width:420px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;">
        <div class="field"><label>Display Name</label><input type="text" id="displayName" placeholder="Your name"></div>
        <button class="btn btn-primary" id="saveBtn" style="width:100%;margin-bottom:14px;">Save</button>
        <button class="btn btn-outline" id="clearBtn" style="width:100%;">Clear all saved logos &amp; uploads</button>
        <p style="font-size:12px;color:var(--text-faint);margin-top:14px;">This is a local demo — there's no account system or server. Everything (saved logos, uploads, brand kit) lives only in this browser's storage.</p>
      </div>
    </main>
  </div>
  <script src="js/app-shell.js" type="module"></script>
  <script>
    const nameInput = document.getElementById("displayName");
    nameInput.value = localStorage.getItem("lm_display_name") || "";
    document.getElementById("saveBtn").addEventListener("click", () => {
      localStorage.setItem("lm_display_name", nameInput.value);
      const btn = document.getElementById("saveBtn");
      const old = btn.textContent;
      btn.textContent = "Saved ✓";
      setTimeout(() => (btn.textContent = old), 1400);
    });
    document.getElementById("clearBtn").addEventListener("click", () => {
      if (!confirm("This removes all saved logos, uploads, and brand kit settings from this browser. Continue?")) return;
      ["lm_saved_logos", "lm_uploads", "lm_brand_kit", "lm_current_project"].forEach((k) => localStorage.removeItem(k));
      alert("Cleared.");
    });
  </script>
</body>
</html>
